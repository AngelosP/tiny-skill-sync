# Publishes the one-page site in site\ to GitHub Pages: https://angelosp.github.io/tiny-skill-sync/
# Runs on a push to main that changes site\, the demo GIF or this file, and by hand (Actions, Pages, Run workflow).
# There is no build step: site\ is published as it is, plus a copy of docs\demo.gif. It needs Pages turned on once,
# with "GitHub Actions" as the source (Settings, Pages). See CONTRIBUTING.md, "The web page".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/demo.gif'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer run waits, and a run already deploying is never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the demo GIF
        run: cp docs/demo.gif site/demo.gif

      - name: Check the site's settings
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
