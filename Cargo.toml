[package]
name = "tiny-skill-sync"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny Windows tray app that keeps user-level Copilot skills in sync with GitHub repositories."
publish = false
autoexamples = false

[lib]
name = "tiny_skill_sync"
path = "src/lib.rs"

# The tray app: a GUI-subsystem exe, no console window.
[[bin]]
name = "tiny-skill-sync"
path = "src/main.rs"

# The command line tool: same core, console subsystem. Used by scripts, tests and benchmarks.
[[bin]]
name = "tss"
path = "src/bin/tss.rs"

# Feasibility spikes (S1 to S3). Built only with `--features spikes`; see spikes\README.md.
[[example]]
name = "s1b_fingerprint"
path = "examples/s1b_fingerprint.rs"
required-features = ["spikes"]

[[example]]
name = "s3_tray"
path = "examples/s3_tray.rs"
required-features = ["spikes"]

[[example]]
name = "s3_floor"
path = "examples/s3_floor.rs"
required-features = ["spikes"]

[features]
spikes = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# Smaller PDBs and faster links; stack traces still show file and line.
debug = "line-tables-only"

[profile.release]
# "s": the tray exe is 0.84 MiB instead of 1.06 MiB (budget 1 MiB); SHA-1 runs at 400 MB/s instead of 435.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Size variants measured in spike S3.
[profile.size-s]
inherits = "release"
opt-level = "s"

[profile.size-z]
inherits = "release"
opt-level = "z"
